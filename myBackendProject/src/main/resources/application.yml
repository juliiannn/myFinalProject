spring:
    application:
        name: myFinalProject
    datasource:
        url: jdbc:sqlite:file:colegio_server_kotlin?mode=memory&cache=shared
        driver-class-name: org.sqlite.JDBC
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.community.dialect.SQLiteDialect
                format_sql: true
        defer-datasource-initialization: true
    sql:
        init:
            mode: always
app:
    jwt:
        secret: ${JWT_SECRET:my-super-secret-key-for-colegio-api-2026}
        expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}